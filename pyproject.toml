[project]
name = "resume"
version = "0.1.0"
description = "Resume ATS Tailoring & PDF Generation Application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "fastapi[standard]>=0.141.1",
    "itsdangerous>=2.2.0",
    "joserfc>=1.7.4",
    "langchain[google-genai,ollama]>=1.3.14",
    "reportlab>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
]

[tool.fastapi]
entrypoint = "server.main:app"

[tool.uv]
package = false
